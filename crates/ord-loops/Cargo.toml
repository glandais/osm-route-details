[package]
name = "ord-loops"
description = "Moteur de génération de boucles sur graphe OSM en mode « raccords » (lot 2) : strict, équipe d'abord, découverte"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# La construction d'équipe d'avant la finition 2 du lot 6, gardée pour le banc (`--teams-reference`) ; les tests l'ont
# toujours.
reference = []
# La sonde du coût d'une recherche point à point (lot 4, 4c, `ord-loops-lot4c-sonde.md`) : code de mesure, pour le
# banc seulement. Elle porte aussi le prototype de la retouche d'un parcours du lot 0 (`probe_graft::move_end_in`,
# `Workspace::set_keep_out`, `ord-retouche-lot0.md`), jamais appelé par la génération ordinaire. Le masque de chaînes
# interdites (`KeepOut`) n'en dépend plus depuis le lot 7a (`ord-retouche-lot1.md`) : la retouche publique du moteur
# (`move_end`, `resize`) est toujours compilée.
probe = []

[dependencies]
ord-graph.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
# L'exemple sur la vraie région ouvre les fichiers par mmap ; le crate lui-même n'en a pas besoin.
ord-graph = { workspace = true, features = ["mmap"] }
tempfile.workspace = true

[lints]
workspace = true
