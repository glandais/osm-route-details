# cargo-deny : licences, avis de sécurité, doublons et origines (T05 §6, job `deny`).

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Via serde_yaml_ng, dans ord-bench seulement : le manifest du dépôt, jamais d'entrée du service.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml non maintenu, hors de l'image" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# Crates du workspace : non publiés (Apache-2.0).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
