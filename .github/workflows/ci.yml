# CI (T05 §6). Aucun job ne touche le réseau en test ni au banc : pas de cache de banc, pas de
# bench/private/ (cas perso `skipped`), toutes les URL de test vers 127.0.0.1. Ni `judge` ni
# `fill-cache` ne tournent en CI.
name: ci

on:
  push:
    branches: [develop]
  pull_request:
  # `bench-offline` seulement, sur un runner local qui a le cache de banc et bench/private/.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Crates purs sans runtime ni réseau (T01 §2.1)
        run: |
          status=0
          for crate in ord-domain ord-core ord-adapters; do
            if cargo tree --locked -p "$crate" -e normal --prefix none | grep -E '^(tokio|reqwest|axum|hyper) '; then
              echo "::error::$crate dépend d'un runtime ou d'un client réseau"
              status=1
            fi
          done
          exit $status

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo test --workspace --locked --doc

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Contrat commité = contrat du code (T05 §2.5)
        run: cargo test --locked -p ord-server --test contract
      - name: Aucune rupture de /v1 par rapport à la branche principale
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          if ! git cat-file -e "$base:contract/openapi.json" 2>/dev/null; then
            echo "pas de contrat sur $base : comparaison sautée"
            exit 0
          fi
          git show "$base:contract/openapi.json" > /tmp/base-openapi.json
          go install github.com/oasdiff/oasdiff@latest
          "$(go env GOPATH)/bin/oasdiff" breaking /tmp/base-openapi.json contract/openapi.json --fail-on ERR

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Contrôle du results.json commité (T05 §4, §6) : empreintes courantes des règles, du manifest,
  # des critères et des BenchRules ; cache.lock et baseline.json s'ils existent.
  bench-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: bench/private absent, cache de banc vide
        run: test ! -e bench/private
      - run: cargo run --locked -p ord-bench -- --cache-dir "$RUNNER_TEMP/aucun-cache" bench-report

  # Image construite et sonde de vie, sans rien pousser ; le conteneur tourne sans réseau.
  docker:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.ref != 'refs/heads/develop' }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t osm-route-details:ci .
      - name: /health/live sur le conteneur
        run: |
          docker run -d --name ord --network none \
            -e ORD_CACHE__OFFLINE=true -e ORD_ELEVATION__MAPTERHORN__VERSION=ci \
            osm-route-details:ci
          for i in $(seq 1 30); do
            if docker exec ord /usr/local/bin/osm-route-details healthcheck; then exit 0; fi
            sleep 1
          done
          docker logs ord
          exit 1

  # Campagne de calibration hors ligne (T05 §6) : jamais sur un runner GitHub (ni cache de banc, ni
  # traces privées). À la main : `scripts/bench-offline.sh`, ou ce job, déclenché à la main sur un
  # runner local étiqueté `ord-bench` qui a ~/.cache/osm-route-details/bench et bench/private/.
  bench-offline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ord-bench]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - run: scripts/bench-offline.sh
