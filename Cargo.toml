[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
ord-domain = { path = "crates/ord-domain" }
ord-core = { path = "crates/ord-core" }
ord-adapters = { path = "crates/ord-adapters" }
ord-data = { path = "crates/ord-data" }
ord-pipeline = { path = "crates/ord-pipeline" }
ord-testkit = { path = "crates/ord-testkit" }

anyhow = "1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
image-webp = "0.2"
moka = { version = "0.12", features = ["future", "sync"] }
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "gzip", "brotli"] }
roxmltree = "0.21"
rstar = "0.13"
rustc-hash = "2"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
flate2 = "1"
http-body-util = "0.1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "compression-br", "decompression-gzip", "decompression-br", "map-request-body", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = "6"
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
