[package]
name = "ord-loops-bench"
description = "Banc du générateur de boucles (lot 2) : rejoue les requêtes du banc Java sur les équipes de la région, contrôle chaque parcours avec le contrôleur indépendant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ord-graph = { workspace = true, features = ["mmap"] }
ord-loops = { path = "../../crates/ord-loops", features = ["reference"] }
ord-loops-check = { path = "../../crates/ord-loops-check", features = ["reference"] }
# La correspondance du curseur du service (lot 3a), pour jouer en processus exactement ce que le service applique.
ord-server = { path = "../../crates/ord-server" }
# Le banc de vraisemblance (lot 4, 4a) rejoue l'appariement et le dépôt de l'outil et du service.
ord-graph-match.workspace = true

anyhow.workspace = true
clap.workspace = true
flate2.workspace = true
memmap2.workspace = true
rayon.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
