# Critères d'acceptation du banc, forme lisible par machine de bench/README.md §3–§4.
# STATUT : gelé le 2026-10-30, avant tout passage du service. Toute modification est un commit dédié,
# motivé, antérieur à la mesure qu'elle concerne (README §2).
# Modifié le 2026-10-31 (décision de l'utilisateur, README §4 bis) : périmètre vélo des critères
# d'ouvrage, E4 par tunnel OSM et portail en bande 10–30 m, E3 médiane des passages. Seuils inchangés ;
# avant toute nouvelle mesure et avant le jugement de la série tenue à l'écart.
# Complété le 2026-10-31 (décision de l'utilisateur, README §4 bis) : source des tags du périmètre vélo
# = tuiles de la campagne (absent_des_donnees), bandes de portail invalides dans une série de tunnels
# (référence indisponible), limite_donnees comptée (Arly). Seuils inchangés ; avant toute nouvelle
# mesure et avant le jugement de la série tenue à l'écart.
# Complété à nouveau le 2026-10-31 (décision de l'utilisateur, README §4 bis) : bande invalide sur un
# tronçon à l'air libre < 120 m entre deux tunnels OSM ; contrôle hors_graphe_velo satisfait aussi par
# un appariement à une voie du graphe vélo distincte de l'ouvrage. Seuils inchangés ; avant toute
# nouvelle mesure.
# Complété une troisième fois le 2026-10-31 (décision de l'utilisateur, README §4 bis) : décalage local
# E3 sur les approches 50–300 m, référence incertaine si les deux côtés diffèrent de plus de 2 m ;
# bande de portail invalide sur un pont ou un tunnel des tuiles. Seuils inchangés ; avant toute
# nouvelle mesure. Puis plausibilité E4 : pente implicite entre portails retenus > 25 % = référence
# indisponible (vérifiée sur la calibration avant adoption). Puis passage en hauteur sur un pont
# (README §2.1) : test de niveau si MNH au milieu ≥ 10 m (vérifié sur la calibration avant adoption).
# Puis baro des points insérés (README §2.1) : gardé à 30 m au plus d'une voie des tuiles de la
# campagne qui juge la trace. Puis E2b : D+ baro en preset dem, comme le service (README §4 bis.5).
# Modifié le 2026-11-01 (décision de l'utilisateur, README §4 bis.4, avant le gel du MVP) : un
# ouvrage que le schéma de la source ne type pas comme tel sort d'E4/E3 et de S1, rapporté à part
# (limite_donnees). Seuils inchangés ; avant toute nouvelle mesure. Puis M1 : plages d'une trace
# recalée sans voie streets à 30 m sorties de M1, rapportées à part (README §4 bis.6). Puis R3
# rapporté, non bloquant, seuils inchangés (README §4 bis.7).
# Après le jugement du MVP (7f171d2, refusé), règles pour V1 (décisions de l'utilisateur, 2026-11-01,
# README §4 ter) : grain de S1 (recouvrement continu) ; attribution d'un passage par la trace brute ;
# M1 hors graphe vélo (voie la plus proche fermée au vélo). Seuils inchangés ; avant toute nouvelle mesure.
# Le gel du MVP (gel/MVP.json) garde les empreintes jugées ; ce fichier sera gelé à nouveau pour V1.
# Un critère `bloquant: true` qui échoue sur la série tenue à l'écart refuse l'incrément ;
# `bloquant: false` est rapporté sans refuser.
# Les cas évalués sont désignés par les groupes du manifest ; les séries par tools/series_groups.py
# (calibration : réglage et non-régression ; tenue_a_l_ecart : jugement unique par incrément).
version: 1
increment: v1   # MVP jugé le 2026-11-01 (7f171d2), refusé
statut: brouillon   # gelé à nouveau avant le jugement V1 (bench/gel/V1.json)
references:
  readme: "bench/README.md §3 (définitions), §4 (seuils)"
  manifest: bench/manifest.yaml

decisions:   # de l'utilisateur, 2026-10-30
  - id: e2_bloquant
    decision: "E2 indicatif (suivi en non-régression) ; seul E2b (ne pas dégrader vs le service sans correction d'ouvrage) est bloquant"
  - id: traces_enregistrees
    decision: "Les traces perso sont recalées sur la route (Stadia Maps trace_attributes) avant d'entrer dans le service ; l'altitude est comparée au baro transporté sur la géométrie recalée (README §2.1)"
  - id: bornes_entree
    decision: "Bornes 200 km / 16 000 points sur l'ENTRÉE seulement ; une trace plus longue est découpée par l'outil de banc en tronçons ≤ 200 km (perso-06) ; la sortie n'est pas bornée"
  - id: reference_r3
    decision: "Vérité du revêtement = réponse trace_attributes de Stadia Maps sur les traces recalées ; réponses hors git, régénérables"
  - id: perimetre_velo   # 2026-10-31
    decision: "Ouvrages portés par une voie hors graphe vélo (règle de tags du service) sortis de S1/E3/E4/E5, rapportés à part (hors_graphe_velo) ; les négatifs dont la trace est hors graphe restent dans S2/E5"
  - id: e4_par_tunnel_osm   # 2026-10-31
    decision: "E4 par tunnel OSM entre ses propres portails ; balcons non tagués rapportés avec S3 ; portail = médiane du MNT entre 10 et 30 m hors portail, sensibilité 5/10/20/30 m rapportée"
  - id: e3_mediane_passages   # 2026-10-31
    decision: "E3 par pont = médiane, sur les passages, de l'écart au milieu et de l'écart max ; le baro reste la référence"
  - id: source_tags_perimetre   # 2026-10-31
    decision: "Tags du périmètre vélo lus dans les tuiles de la campagne (data_versions), pas dans le corpus Overpass ; géométrie du corpus absente des données = absent_des_donnees, rapporté, non compté"
  - id: bande_portail_invalide   # 2026-10-31
    decision: "Bande 10–30 m invalide (chevauche un autre ouvrage ou < 3 stations hors ouvrage) remplacée par la première bande valide plus loin dans la série ; aucune à moins de 1 km = référence indisponible, rapporté, non compté"
  - id: balcon_court_invalide   # 2026-10-31
    decision: "Bande de portail sur un tronçon à l'air libre de moins de 120 m entre deux tunnels OSM invalide ; remplacement existant (première bande valide plus loin, même côté, 1 km, sinon référence indisponible)"
  - id: controle_hors_graphe_parallele   # 2026-10-31
    decision: "Contrôle hors_graphe_velo satisfait si la portion est non appariée ou appariée à une voie du graphe vélo distincte de celle de l'ouvrage"
  - id: e3_decalage_approches   # 2026-10-31
    decision: "Décalage local E3 = médiane (baro − MNT LiDAR) sur les approches 50–300 m de chaque côté, hors autres ouvrages et fenêtres masquées ; ≥ 20 stations par côté sinon repli 1–3 km mentionné ; côtés différant de plus de 2 m = référence incertaine, rapportée, non comptée"
  - id: bande_sur_ouvrage_des_tuiles   # 2026-10-31
    decision: "Bande de portail E4 invalide si elle chevauche un pont ou un tunnel des tuiles de la campagne (bridge=true / tunnel=true), du corpus ou non ; remplacement existant"
  - id: e4_plausibilite_pente   # 2026-10-31
    decision: "Pente implicite entre portails retenus > 25 % = référence indisponible, rapportée, non comptée ; borne de géométrie routière, indépendante du service"
  - id: passage_en_hauteur   # 2026-10-31
    decision: "Pont à MNH au milieu ≥ 10 m : passage compté seulement si médiane (baro corrigé − MNT) à ± 12,5 m du milieu (≥ 3 stations) ≥ ½ MNH ; sinon critère horizontal avec niveau_non_discriminant ou niveau_sans_baro ; partition des séries inchangée"
  - id: baro_points_inseres   # 2026-10-31
    decision: "Point d'origine inséré à la place d'un saut (insere = 1) : baro gardé seulement à ≤ 30 m d'une voie de la couche streets des tuiles de la campagne qui juge la trace ; tuile absente à la source = sans voie ; test fait par ord-bench"
  - id: e2b_preset_baro_dem   # 2026-10-31
    decision: "E2b : D+ baro calculé avec le preset dem (3 m, 30 m), le même que le service et sa référence sans correction ; E2 indicatif reste en barometric (2 m, 15 m)"
  - id: limite_donnees_hors_decompte   # 2026-11-01, remplace limite_donnees_comptee (2026-10-31)
    decision: "Un ouvrage du corpus que la source du service ne type pas comme tunnel ou pont à cause de son schéma sort d'E4 (E3 pour un pont) et de S1 ; rapporté à part comme limite des données du MVP, à la manière de S3, sans seuil"
  - id: m1_hors_reseau   # 2026-11-01
    decision: "M1 sur les traces recalées : une plage sans aucune voie de la couche streets à moins de 30 m (tuiles de la campagne qui juge la trace, tuile + 8 voisines) sort de M1 et est rapportée à part (hors_reseau)"
  - id: r3_non_bloquant   # 2026-11-01
    decision: "R3 rapporté, non bloquant, seuils inchangés : accord entre deux dérivés d'OSM de dates différentes, un décalage de version n'est pas un défaut du service ; R1 (85 %) et R2 restent bloquants"
  - id: s1_recouvrement_continu   # 2026-11-01, V1
    decision: "S1 : longueur typée = recouvrement continu de [s_A, s_B] par les segments structure du service, tolérance d'un demi-pas (2,5 m) à chaque borne ; rappel = typé ÷ (s_B − s_A) ; E3 et E4 inchangés"
  - id: attribution_passage   # 2026-11-01, V1
    decision: "Passage attribué à un pont ou tunnel du corpus seulement si la trace brute suit sa voie mieux que tout autre pont/tunnel des tuiles (plus petite médiane, §4 bis.1) ; sinon passage_sur_ouvrage_parallele, rapporté, non compté"
  - id: m1_hors_graphe_velo   # 2026-11-01, V1
    decision: "M1 : station recalée dont la voie streets la plus proche (≤ 30 m, tuiles de la campagne) est fermée au vélo par la règle de tags du service sort de M1, rapportée (hors_graphe_velo_m), contrôle matched=false + unmatched_range ; tags des tuiles seulement ; risque de circularité accepté"

perimetre:   # README §4 bis.1
  hors_graphe_velo:
    regle: "voie OSM de l'ouvrage exclue du graphe vélo par la règle de tags du service (T03 §4.2 étape 1 : motorway, trunk en France, pedestrian, bridleway, busway ; bicycle=* prime)"
    exclus_de: [S1, E3, E4, E5]
    controle:   # passe si l'une des deux conditions est vraie
      passe_si_un_de: [{matched: false, avertissement: unmatched_range}, apparie_a_une_voie_du_graphe_velo_distincte_de_l_ouvrage]
      erreur_altitude: rapportee_si_reference_sinon_null_avec_raison
    seuils: []
    note: "Ne concerne que l'ouvrage dont la propre voie est hors graphe ; une trace hors graphe (n04, n08, n09) reste dans S2/E5"
    source_tags: {donnees: campagne.data_versions, couche: streets, attributs: [kind, bicycle, bridge, tunnel], pas: corpus_overpass}
  absent_des_donnees:
    regle: "géométrie de l'ouvrage du corpus sans équivalent dans les tuiles de la campagne"
    rapporte_en: {tunnel: E4_non_couvert, bridge: E3_non_couvert}
    compte: false
    cas_connus: [nantes-anne-de-bretagne]
  limite_donnees:   # README §4 bis.4, 2026-11-01
    regle: "ouvrage du corpus que la source du service ne type pas comme tunnel ou pont à cause de son schéma (attribut absent de la couche lue), non un tag OSM absent ou faux"
    exclus_de: {tunnel: [E4, S1], bridge: [E3, S1]}
    compte: false
    rapporte: {erreur_altitude: mesuree_contre_sa_reference, seuils: [], note: attribut_manquant}
    cas_connus:   # appliquée par le schéma, jamais par cette liste
      - {ouvrages: [arly-galerie, nv-30, nv-37], note: "shortbread sans avalanche_protector"}

passage_pont:   # README §2.1
  horizontal: {tolerance_m: 40, points: [A, milieu, B]}
  niveau:
    applique_si: {mnh_milieu_m_min: 10.0}   # MNH = médiane MNS 25 m − MNT au milieu
    mesure: "médiane (baro corrigé − MNT) sur les stations à ± 12,5 m du milieu"
    stations_baro_min: 3
    retire_si: "mesure < 0.5 × MNH"
    sinon: {mnh_inferieur: niveau_non_discriminant, baro_insuffisant: niveau_sans_baro}
    budget_erreur_m: {bruit_baro: 1.0, decalage: 2.0, retard_baro: 4.0}   # ≈ 5 m ⇒ MNH ≥ 2 × 5 m
  porte_sur: [E3, S1, hors_graphe_velo]
  partition_series: inchangee
  attribution:   # README §4 ter.2, V1
    lit: trace_brute   # GPS d'origine, pas la trace recalée ; jamais le service
    mesure: "médiane des distances des points bruts de l'emprise à la voie de l'ouvrage (§4 bis.1)"
    concurrents: {source: campagne.data_versions, couche: streets, attributs: [bridge, tunnel]}
    attribue_si: plus_petite_mediane
    sinon: {marque: passage_sur_ouvrage_parallele, rapporte: true, compte: false}
    porte_sur: [E3, E4, S1, hors_graphe_velo]   # E5 (passage dessous) non concerné

preparation:
  recalage: {outil: tools/stadia_match.py, service: "Stadia Maps trace_attributes", costing: bicycle, pas_m: 25, entree: "*.trim1km.gpx"}
  decoupage: {max_km: 200, max_points: 16000, cas: [perso-06]}
  baro_points_inseres:   # README §2.1, étape 3
    colonne: insere   # <id>.baro.csv, 1 = point d'origine inséré par fill_jumps
    garde_si: {distance_voie_m_max: 30.0, couche: streets, tuiles: [point, 8_voisines]}
    tuiles: campagne_qui_juge_la_trace   # série tenue à l'écart : campagne de jugement
    tuile_absente_a_la_source: sans_voie
    applique_par: ord-bench   # au chargement du baro ; le recalage ne tranche pas

criteres:
  - id: E1
    metrique: "Erreur d'altitude hors ouvrage vs baro, après décalage global et retrait de tendance > 5 km"
    cas: {manifest: perso, groupes: [dplus, plaine]}
    terrain: france
    agregation: par_trace
    seuils:
      - {strate: plaine, rmse_m_max: 1.5, p95_m_max: 4.0}
      - {strate: dplus, rmse_m_max: 3.0, p95_m_max: 8.0}
    passe_si: toutes_les_traces
    bloquant: true

  - id: E2
    metrique: "D+ service (preset dem) / D+ baro (preset barometric), passages mixtes masqués"
    cas: {manifest: perso, groupes: [dplus, plaine, ouvrage]}
    terrain: france
    agregation: par_trace
    seuils:
      - {ratio_min: 0.90, ratio_max: 1.20, portee: chaque_trace}
      - {ratio_median_min: 0.95, ratio_median_max: 1.12, portee: chaque_groupe}
    passe_si: tous
    bloquant: false   # indicatif : mesuré, suivi en non-régression (baseline.json)

  - id: E2b
    metrique: "Les corrections d'ouvrage ne dégradent pas le D+"
    definition: >-
      Pour chaque groupe g : médiane_g |ln(D+ service / D+ baro)| ≤ médiane_g |ln(D+ référence / D+ baro)|.
      D+ référence : le même service, appelé avec l'option publique `structure_correction: false`
      (contrat §3.2 ; le lissage est désactivé par défaut) : mêmes sources (LiDAR HD, repli
      Mapterhorn), même géométrie recalée, même preset dem, mêmes tronçons masqués. On mesure
      l'apport des corrections. Le RGE ALTI n'est pas retenu : trop peu exigeant (≈ 7 m d'erreur
      en montagne contre le LiDAR que lit le service), le critère serait presque toujours vrai.
      D+ baro : preset dem (3 m, 30 m) sur le baro transporté, le même traitement que le service
      et sa référence (décision de l'utilisateur, 2026-10-31 ; E2 indicatif reste en barometric).
    preset_baro: dem   # E2 : barometric
    cas: {manifest: perso, groupes: [dplus, plaine, ouvrage]}
    terrain: france
    agregation: mediane_par_groupe
    seuils:
      - {ecart_log_service_max: ecart_log_service_sans_correction}
    passe_si: tous_les_groupes
    bloquant: true

  - id: E3
    metrique: "Erreur d'altitude sur tablier de pont tagué (milieu et max sur l'emprise)"
    cas: {manifest: [ouvrages, ouvrages_perso, perso], types: [bridge]}
    reference: {priorite: [baro_corrige_local, mns_mediane_25m], note: "mns = cohérence seulement"}
    terrain: france
    agregation: par_pont
    agregation_passages: mediane   # écart au milieu et écart max : médianes sur les passages du pont
    decalage_local:   # README §4 bis.3
      calcul: "médiane (baro − MNT LiDAR)"
      approches_m: [50, 300]   # de chaque côté du pont
      exclut: [autres_ouvrages, fenetres_masquees]
      stations_min_par_cote: 20
      repli: {fenetre_km: [1, 3], mention: decalage_repli_1_3km}
      incertaine_si_ecart_entre_cotes_m_sup: 2.0
      incertaine: {rapporte: true, compte: false}
    perimetre: graphe_velo
    seuils:
      - {strate: pont_court, longueur_m_max: 300, milieu_abs_m_max: 2.0, max_abs_m_max: 3.0}
      - {strate: grand_pont, longueur_m_min: 300, milieu_abs_m_max: 2.0, max_abs_m_max: 5.0}
    passe_si: {part_min: 0.90}
    bloquant: true

  - id: E3_hors_france
    metrique: "Erreur d'altitude sur tablier hors LiDAR (pont interpolé)"
    cas: {manifest: [ouvrages, ouvrages_perso, perso], types: [bridge]}
    terrain: hors_france
    agregation: par_pont
    seuils: []
    passe_si: rapporte
    bloquant: false

  - id: E4
    metrique: "Erreur max vs droite entre portails ; D+ fictif dans le tunnel"
    cas: {manifest: [ouvrages, ouvrages_perso, vcyclist], types: [tunnel]}
    terrain: france
    agregation: par_tunnel_osm   # chaque way tunnel (ou suite contiguë) entre ses propres portails ; balcons non tagués → S3
    perimetre: graphe_velo
    reference: {droite_entre_portails: true, altitude_portail: "médiane du MNT des stations entre 10 et 30 m hors du portail, sur l'approche"}
    sensibilite: {portail_m: [5, 10, 20, 30], marque: reference_ambigue_si_le_verdict_bascule}
    plausibilite:   # README §4 bis.2
      pente_implicite: "|z_sortie − z_entree| / distance curviligne entre portails retenus"
      pente_max: 0.25
      sinon: {marque: reference_indisponible, rapporte: true, compte: false}
    bande_invalide:   # README §4 bis.2
      si: [chevauche_autre_ouvrage, stations_hors_ouvrage_moins_de_3, balcon_entre_tunnels_osm]   # autre ouvrage : tunnel, galerie, balcon S3, pont ou tunnel des tuiles
      ouvrage_des_tuiles: {source: campagne.data_versions, attributs: [bridge, tunnel], corpus_ou_non: true}
      balcon_entre_tunnels_osm: {troncon_air_libre_m_max: 120}   # bande sur un tronçon à l'air libre < 120 m entre deux tunnels OSM
      remplacement: premiere_bande_valide_plus_loin_dans_la_serie_meme_cote
      distance_max_m: 1000
      sinon: {marque: reference_indisponible, rapporte: true, compte: false}
    seuils:
      - {max_abs_m_max: 5.0, dplus_fictif_m_max: 5.0}
    passe_si: {part_min: 0.857}   # 6/7
    bloquant: true

  - id: E5
    metrique: "|service − MNT| au croisement d'un passage sous un pont"
    cas: {manifest: [ouvrages, perso], types: [passage_sous_pont]}
    agregation: par_croisement
    perimetre: graphe_velo   # l'ouvrage du dessus peut être hors graphe ; c'est le passage dessous qui doit l'être
    seuils:
      - {abs_m_max: 1.0}
    passe_si: tous
    bloquant: true

  - id: S1
    metrique: "Rappel en longueur des ponts/tunnels tagués OSM"
    cas: {manifest: [ouvrages, ouvrages_perso, vcyclist]}
    agregation: longueur_totale
    perimetre: graphe_velo   # balcons non tagués entre tunnels exclus
    longueur_typee:   # README §4 ter.1, V1
      mesure: recouvrement_continu   # [s_A, s_B] ∩ segments structure (bridge/tunnel) du service
      tolerance_borne_m: 2.5   # demi-pas : segment arrêté à ≤ 2,5 m d'une borne prolongé jusqu'à elle
      rappel: "longueur typée / (s_B − s_A)"
      ne_touche_pas: [E3, E4]
    seuils:
      - {rappel_min: 0.95}
    passe_si: tous
    bloquant: true

  - id: S2
    metrique: "Faux positifs d'ouvrage"
    cas: {manifest: [vcyclist_temoins_negatifs, perso]}
    agregation: longueur_totale
    seuils:
      - {ouvrages_fictifs_max: 0, part_longueur_max: 0.005}
    passe_si: tous
    bloquant: true

  - id: S3
    metrique: "Ouvrage non tagué (stn-acces-nord ; balcons non tagués entre tunnels, réf. vcyclist S) : altitude, rapportée"
    cas: {manifest: [ouvrages, perso, vcyclist], ids: [stn-acces-nord], balcons_entre_tunnels: true}
    seuils: []
    passe_si: rapporte
    bloquant: false

  - id: R1
    metrique: "Accord de classe de revêtement vs Stadia (total et hors inconnu Stadia)"
    cas: {manifest: osm_surface}
    agregation: par_parcours
    seuils:
      - {accord_min: 0.85, accord_hors_inconnu_min: 0.85}
    passe_si: tous
    bloquant: true

  - id: R2
    metrique: "Accord revêtu / non revêtu vs Stadia"
    cas: {manifest: osm_surface}
    agregation: par_parcours
    seuils:
      - {accord_min: 0.97}
    passe_si: tous
    bloquant: true

  - id: R3
    metrique: "Accord du revêtement vs Stadia Maps trace_attributes (edge.surface), en longueur, même table de classes que R1"
    cas: {manifest: perso, groupes: [dplus, plaine, ouvrage, hors_france]}
    reference: {source: "Stadia Maps trace_attributes", fichiers: "private/recales/<id>.surface.csv (hors git)"}
    agregation: par_trace
    seuils:
      - {accord_classe_min: 0.85, accord_revetu_non_revetu_min: 0.97}
    passe_si: tous
    bloquant: false   # README §4 bis.7, 2026-11-01 : rapporté, seuils inchangés

  - id: M1
    metrique: "Appariement : part non appariée et part unknown, en longueur"
    cas: {manifest: [osm_surface, perso, vcyclist]}
    agregation: par_parcours
    hors_reseau:   # README §4 bis.6, 2026-11-01 ; traces recalées
      regle: "plage de la trace recalée dont aucun point n'a de voie de la couche streets à moins de 30 m"
      distance_voie_m_max: 30.0
      tuiles: {source: campagne_qui_juge_la_trace, couche: streets, voisinage: [point, 8_voisines], tuile_absente_a_la_source: sans_voie}
      exclue_de: [non_apparie, longueur_totale, unknown]
      rapporte: {cle: hors_reseau, par: trace, mesure: longueur_m}
      lit: [tuiles, trace_recalee]   # jamais la réponse du service
    hors_graphe_velo:   # README §4 ter.3, V1 ; traces recalées
      regle: "station recalée dont la voie la plus proche de la couche streets (≤ 30 m) est fermée au vélo par la règle de tags du service (T03 §4.2 étape 1)"
      distance_voie_m_max: 30.0
