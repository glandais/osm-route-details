# Critères d'acceptation du banc, forme lisible par machine de bench/README.md §3–§4.
# STATUT : gelé le 2026-10-30, avant tout passage du service. Toute modification est un commit dédié,
# motivé, antérieur à la mesure qu'elle concerne (README §2).
# Modifié le 2026-10-31 (décision de l'utilisateur, README §4 bis) : périmètre vélo des critères
# d'ouvrage, E4 par tunnel OSM et portail en bande 10–30 m, E3 médiane des passages. Seuils inchangés ;
# avant toute nouvelle mesure et avant le jugement de la série tenue à l'écart.
# Complété le 2026-10-31 (décision de l'utilisateur, README §4 bis) : source des tags du périmètre vélo
# = tuiles de la campagne (absent_des_donnees), bandes de portail invalides dans une série de tunnels
# (référence indisponible), limite_donnees comptée (Arly). Seuils inchangés ; avant toute nouvelle
# mesure et avant le jugement de la série tenue à l'écart.
# Complété à nouveau le 2026-10-31 (décision de l'utilisateur, README §4 bis) : bande invalide sur un
# tronçon à l'air libre < 120 m entre deux tunnels OSM ; contrôle hors_graphe_velo satisfait aussi par
# un appariement à une voie du graphe vélo distincte de l'ouvrage. Seuils inchangés ; avant toute
# nouvelle mesure.
# Complété une troisième fois le 2026-10-31 (décision de l'utilisateur, README §4 bis) : décalage local
# E3 sur les approches 50–300 m, référence incertaine si les deux côtés diffèrent de plus de 2 m ;
# bande de portail invalide sur un pont ou un tunnel des tuiles. Seuils inchangés ; avant toute
# nouvelle mesure. Puis plausibilité E4 : pente implicite entre portails retenus > 25 % = référence
# indisponible (vérifiée sur la calibration avant adoption). Puis passage en hauteur sur un pont
# (README §2.1) : test de niveau si MNH au milieu ≥ 10 m (vérifié sur la calibration avant adoption).
# Puis baro des points insérés (README §2.1) : gardé à 30 m au plus d'une voie des tuiles de la
# campagne qui juge la trace. Puis E2b : D+ baro en preset dem, comme le service (README §4 bis.5).
# Modifié le 2026-11-01 (décision de l'utilisateur, README §4 bis.4, avant le gel du MVP) : un
# ouvrage que le schéma de la source ne type pas comme tel sort d'E4/E3 et de S1, rapporté à part
# (limite_donnees). Seuils inchangés ; avant toute nouvelle mesure. Puis M1 : plages d'une trace
# recalée sans voie streets à 30 m sorties de M1, rapportées à part (README §4 bis.6). Puis R3
# rapporté, non bloquant, seuils inchangés (README §4 bis.7).
# Après le jugement du MVP (7f171d2, refusé), règles pour V1 (décisions de l'utilisateur, 2026-11-01,
# README §4 ter) : grain de S1 (recouvrement continu) ; attribution d'un passage par la trace brute ;
# M1 hors graphe vélo (voie la plus proche fermée au vélo) ; couverture de la série V1 (minimums,
# sauté ou sous le minimum = refus). Seuils inchangés ; avant toute nouvelle mesure.
# Après la première calibration V1 (règles 2026.11.2 ; décisions de l'utilisateur, 2026-11-01) :
# M1 hors graphe vélo resserrée aux routes motorisées fermées au vélo, plages ≥ 50 m (README §4 ter.3).
# S2 sans les plages hors graphe vélo des témoins (README §4 ter.5).
# Attribution d'un passage : un tablier, un ouvrage (README §4 ter.2).
# S2 : un ouvrage réel tagué sur la voie d'un témoin n'est jamais fictif (README §4 ter.6).
# Le gel du MVP (gel/MVP.json) garde les empreintes jugées ; ce fichier sera gelé à nouveau pour V1.
# Un critère `bloquant: true` qui échoue sur la série tenue à l'écart refuse l'incrément ;
# `bloquant: false` est rapporté sans refuser. À partir de V1, un critère bloquant sauté ou sous son
# minimum de couverture (serie_tenue_a_l_ecart.couverture) refuse aussi l'incrément.
# Les cas évalués sont désignés par les groupes du manifest ; les séries par tools/series_groups.py
# (calibration : réglage et non-régression ; tenue_a_l_ecart : jugement unique par incrément).
version: 1
increment: v1   # MVP jugé le 2026-11-01 (7f171d2), refusé
statut: brouillon   # gelé à nouveau avant le jugement V1 (bench/gel/V1.json)
references:
  readme: "bench/README.md §3 (définitions), §4 (seuils)"
  manifest: bench/manifest.yaml

decisions:   # de l'utilisateur, 2026-10-30
  - id: e2_bloquant
    decision: "E2 indicatif (suivi en non-régression) ; seul E2b (ne pas dégrader vs le service sans correction d'ouvrage) est bloquant"
  - id: traces_enregistrees
    decision: "Les traces perso sont recalées sur la route (Stadia Maps trace_attributes) avant d'entrer dans le service ; l'altitude est comparée au baro transporté sur la géométrie recalée (README §2.1)"
  - id: bornes_entree
    decision: "Bornes 200 km / 16 000 points sur l'ENTRÉE seulement ; une trace plus longue est découpée par l'outil de banc en tronçons ≤ 200 km (perso-06) ; la sortie n'est pas bornée"
  - id: reference_r3
    decision: "Vérité du revêtement = réponse trace_attributes de Stadia Maps sur les traces recalées ; réponses hors git, régénérables"
  - id: perimetre_velo   # 2026-10-31
    decision: "Ouvrages portés par une voie hors graphe vélo (règle de tags du service) sortis de S1/E3/E4/E5, rapportés à part (hors_graphe_velo) ; les négatifs dont la trace est hors graphe restent dans S2/E5"
  - id: e4_par_tunnel_osm   # 2026-10-31
    decision: "E4 par tunnel OSM entre ses propres portails ; balcons non tagués rapportés avec S3 ; portail = médiane du MNT entre 10 et 30 m hors portail, sensibilité 5/10/20/30 m rapportée"
  - id: e3_mediane_passages   # 2026-10-31
    decision: "E3 par pont = médiane, sur les passages, de l'écart au milieu et de l'écart max ; le baro reste la référence"
  - id: source_tags_perimetre   # 2026-10-31
    decision: "Tags du périmètre vélo lus dans les tuiles de la campagne (data_versions), pas dans le corpus Overpass ; géométrie du corpus absente des données = absent_des_donnees, rapporté, non compté"
  - id: bande_portail_invalide   # 2026-10-31
    decision: "Bande 10–30 m invalide (chevauche un autre ouvrage ou < 3 stations hors ouvrage) remplacée par la première bande valide plus loin dans la série ; aucune à moins de 1 km = référence indisponible, rapporté, non compté"
  - id: balcon_court_invalide   # 2026-10-31
    decision: "Bande de portail sur un tronçon à l'air libre de moins de 120 m entre deux tunnels OSM invalide ; remplacement existant (première bande valide plus loin, même côté, 1 km, sinon référence indisponible)"
  - id: controle_hors_graphe_parallele   # 2026-10-31
    decision: "Contrôle hors_graphe_velo satisfait si la portion est non appariée ou appariée à une voie du graphe vélo distincte de celle de l'ouvrage"
  - id: e3_decalage_approches   # 2026-10-31
    decision: "Décalage local E3 = médiane (baro − MNT LiDAR) sur les approches 50–300 m de chaque côté, hors autres ouvrages et fenêtres masquées ; ≥ 20 stations par côté sinon repli 1–3 km mentionné ; côtés différant de plus de 2 m = référence incertaine, rapportée, non comptée"
  - id: bande_sur_ouvrage_des_tuiles   # 2026-10-31
    decision: "Bande de portail E4 invalide si elle chevauche un pont ou un tunnel des tuiles de la campagne (bridge=true / tunnel=true), du corpus ou non ; remplacement existant"
  - id: e4_plausibilite_pente   # 2026-10-31
    decision: "Pente implicite entre portails retenus > 25 % = référence indisponible, rapportée, non comptée ; borne de géométrie routière, indépendante du service"
  - id: passage_en_hauteur   # 2026-10-31
    decision: "Pont à MNH au milieu ≥ 10 m : passage compté seulement si médiane (baro corrigé − MNT) à ± 12,5 m du milieu (≥ 3 stations) ≥ ½ MNH ; sinon critère horizontal avec niveau_non_discriminant ou niveau_sans_baro ; partition des séries inchangée"
  - id: baro_points_inseres   # 2026-10-31
    decision: "Point d'origine inséré à la place d'un saut (insere = 1) : baro gardé seulement à ≤ 30 m d'une voie de la couche streets des tuiles de la campagne qui juge la trace ; tuile absente à la source = sans voie ; test fait par ord-bench"
  - id: e2b_preset_baro_dem   # 2026-10-31
    decision: "E2b : D+ baro calculé avec le preset dem (3 m, 30 m), le même que le service et sa référence sans correction ; E2 indicatif reste en barometric (2 m, 15 m)"
  - id: limite_donnees_hors_decompte   # 2026-11-01, remplace limite_donnees_comptee (2026-10-31)
    decision: "Un ouvrage du corpus que la source du service ne type pas comme tunnel ou pont à cause de son schéma sort d'E4 (E3 pour un pont) et de S1 ; rapporté à part comme limite des données du MVP, à la manière de S3, sans seuil"
  - id: m1_hors_reseau   # 2026-11-01
    decision: "M1 sur les traces recalées : une plage sans aucune voie de la couche streets à moins de 30 m (tuiles de la campagne qui juge la trace, tuile + 8 voisines) sort de M1 et est rapportée à part (hors_reseau)"
  - id: r3_non_bloquant   # 2026-11-01
    decision: "R3 rapporté, non bloquant, seuils inchangés : accord entre deux dérivés d'OSM de dates différentes, un décalage de version n'est pas un défaut du service ; R1 (85 %) et R2 restent bloquants"
  - id: s1_recouvrement_continu   # 2026-11-01, V1
    decision: "S1 : longueur typée = recouvrement continu de [s_A, s_B] par les segments structure du service, tolérance d'un demi-pas (2,5 m) à chaque borne ; rappel = typé ÷ (s_B − s_A) ; E3 et E4 inchangés"
  - id: attribution_passage   # 2026-11-01, V1
    decision: "Passage attribué à un pont ou tunnel du corpus seulement si la trace brute suit sa voie mieux que tout autre pont/tunnel des tuiles (plus petite médiane, §4 bis.1) ; sinon passage_sur_ouvrage_parallele, rapporté, non compté"
  - id: m1_hors_graphe_velo   # 2026-11-01, V1
    decision: "M1 : station recalée dont la voie streets la plus proche (≤ 30 m, tuiles de la campagne) est fermée au vélo par la règle de tags du service sort de M1, rapportée (hors_graphe_velo_m), contrôle matched=false + unmatched_range ; tags des tuiles seulement ; risque de circularité accepté"
  - id: m1_hors_graphe_motorise   # 2026-11-01, V1, après la calibration 2026.11.2
    decision: "M1 hors graphe vélo resserrée : seulement les routes motorisées fermées au vélo (motorway, trunk, route bicycle=no), plages continues ≥ 50 m ; piétonnes, trottoirs/sentiers bicycle=no, busways, escaliers, traversées restent dans M1 ; voie la plus proche hors rails (T03 §5.3)"
  - id: s2_hors_graphe_velo   # 2026-11-01, V1, après la calibration 2026.11.2
    decision: "S2 : les plages où la trace suit une voie fermée au vélo (plages hors graphe de M1, §4 ter.3 resserrée) sortent de S2 et sont rapportées par témoin ; le service y rend les ponts OSM réels (bicycle_forbidden), pas des ouvrages fictifs ; E5 inchangé"
  - id: un_tablier_un_ouvrage   # 2026-11-01, V1, après la calibration 2026.11.2
    decision: "Attribution : les voies bridge d'un même tablier forment un seul ouvrage (même polygone man_made=bridge des tuiles ; à défaut de polygone, voie à ≤ 10 m sur toute l'emprise) ; seuls des ponts distincts sont départagés ; tunnels inchangés"
  - id: groupe_e2b_trace_nouvelle   # 2026-11-01, V1
    decision: "Groupe E2b d'une trace nouvelle : dplus si D+ MNT ≥ 11 m/km, sinon ouvrage si ≥ 2 ouvrages comptés, sinon plaine ; calculé avant le tirage, sans le service"
  - id: negatif_q1_serie_nouvelle   # 2026-11-01, V1
    decision: "Négatif Q1 d'une série nouvelle : sortie de 2015-05 → 2020-09 au défaut attesté hors du qualificateur (D+ Strava < 60 % du D+ MNT au scan, confirmé sur le stream complet ; ou, complément du 2026-11-01, > 1,6 × D+ MNT au scan et sur le stream)"
  - id: ouvrage_reel_sur_temoin   # 2026-11-01
    decision: "Un ouvrage réel tagué dans OSM sur la voie d'un témoin négatif (même avalanche_protector ou covered) n'est jamais fictif : plage A–B + 35 m retirée de S2, rapportée ; le témoin sort si l'ouvrage en est l'objet ou en couvre plus de la moitié (tn12 sort, tn10 reste masqué)"
  - id: nature_temoin_planifie   # 2026-11-01, V1
    decision: "Témoin S2 planifié : nature déclarée retenue si OSM la confirme sur ≥ 50 % de la longueur comptée, sinon nature confirmée par ses tags, sinon retiré"
  - id: marge_du_tirage   # 2026-11-01, V1
    decision: "Tirage : chaque strate remplie jusqu'à son minimum majoré de 25 % (arrondi supérieur, chaque composante), sinon la strate entière ; tiers si plus ; seuil de jugement = minimum inchangé"
  - id: source_valhalla_fossgis   # 2026-11-01
    decision: "Recalage et références de revêtement (R3, R1/R2 des parcours planifiés) par le Valhalla public de la FOSSGIS, 1 req/s, en séquence ; toutes les traces recalées par cette source (perso-01..39 comprises) ; données du serveur 2026-11-01T13:01Z"
  - id: e5_reference   # 2026-11-01, après la calibration 2026.11.5-bench1
    decision: "E5 : passage retiré si la trace est elle-même sur un ouvrage des tuiles (≤ 10 m, < 20°) ; référence = baro corrigé localement sur les traces perso fiables ; sinon MNT, indisponible s'il est sans donnée ou lit le tablier (bosse > 2 m vs approches 20–50 m)"
  - id: e5_tolerance_baro   # 2026-11-01, après la calibration 2026.11.6
    decision: "E5, référence baro corrigé localement : tolérance 2 m (comme E3) ; incertaine, rapportée, non comptée, si les décalages baro − MNT des deux côtés (200–1 500 m) diffèrent de plus de 2 m ; MNT : 1 m inchangé ; tous exigé"
  - id: e5_mnt_bosse_incertaine   # 2026-11-01, après la calibration 2026.11.6
    decision: "E5, référence MNT : bosse (MNT au croisement − moyenne des médianes des approches 20–50 m) entre 1,0 et 2,0 m = référence incertaine, rapportée, non comptée ; > 2,0 m indisponible, inchangé"
  - id: e5_plages_o_et_cote_unique   # 2026-11-01, après la calibration 2026.11.6
    decision: "E5 : plages O des témoins vcyclist, approches 20–50 m mesurées depuis les bouts de la plage ; référence baro incertaine, rapportée, non comptée, si un côté compte moins de 3 points de baro entre 200 et 1 500 m"
  - id: e5_lectures_2026_11_02   # 2026-11-02, après la calibration 2026.11.6-bench1
    decision: "E5 : tronçons .partN recousus par abscisse, segments .sN lus un par un ; bosse MNT de 1,0 m ou 2,0 m exactement = incertaine ; côté sans baro (< 3 points) = incertaine sans repli sur le MNT"
  - id: retard_baro   # 2026-11-02, après la calibration 2026.11.6-bench1
    decision: "Retard du baro estimé par trace sur toute la trace (δ de −50 à +200 m minimisant l'écart robuste de baro(s + δ) − MNT) et corrigé avant le calcul des références baro d'E5, E3 et E1 ; non estimable = baro brut, rapporté"
  - id: e5_points_baro_bruts   # 2026-11-02
    decision: "E5 : les points de baro d'un côté (minimum 3) sont les points bruts de baro.csv, hors points insérés écartés et fenêtres masquées, pas les stations de la grille de 5 m"
  - id: e5_points_baro_abscisse_corrigee   # 2026-11-02, après la calibration 2026.11.6-bench2
    decision: "E5 : les points bruts d'un côté se comptent à leur abscisse corrigée du retard (s_p − δ, §4 ter.9), celle où ils entrent dans le décalage du côté"
  - id: e5_approche_sur_ouvrage   # 2026-11-02, après le jugement V1
    decision: "E5, référence MNT : incertaine, rapportée, non comptée, si une approche 20–50 m chevauche un autre ouvrage (station à ≤ 10 m d'une ligne bridge ou tunnel des tuiles à < 20° de la trace : pont emprunté, tunnel) ; définition validée telle quelle le 2026-11-02"
  - id: r_erreur_reference   # 2026-11-02, après le jugement V1
    decision: "R1, R2, R3 contre Valhalla : plage où Valhalla rend une classe non revêtue alors que la voie OSM porte, à la date des données du serveur, surface en revêtement dur sans ambiguïté = erreur de la référence, hors décompte, rapportée à part"
  - id: retard_baro_extraits_jugement   # 2026-11-02, après la calibration 2026.11.6-bench3
    decision: "Au jugement, chaque extrait d'une trace de calibration reçoit le δ de sa trace entière, celui de la calibration gelée (cas.retard_baro de 2026.11.6-bench3), sans réestimation au jugement"
  - id: e1_plaine_bruit_baro   # 2026-11-01, après la calibration 2026.11.5-bench1
    decision: "E1 plaine : trace dont le bruit baro (qualify_baro.py, noise_m) dépasse 1,0 m = référence incertaine, rapportée, non jugée"
  - id: couverture_serie_v1   # 2026-11-01, V1
    decision: "Série tenue à l'écart V1 : minimums de couverture par critère bloquant, comptés après exclusions ; données nouvelles seulement ; tirage stratifié figé avant mesure ; contrôle de couverture sans le service ; sauté ou sous le minimum = refus"
  - id: e1_marche_baro   # 2026-11-02, après la calibration 2026.11.10
    decision: "E1, toutes séries : marche brutale du baro sans marche du MNT (résidu baro(s + δ) − MNT : |Δ| > 10 m entre fenêtres de 200 m séparées de 200 m, confirmé sur 2 000 m, même signe ; MNT d'amplitude ≤ 30 m sur 600 m) = référence incertaine, rapportée, non jugée"
  - id: m1_hors_graphe_voie_parallele   # 2026-11-02, après la calibration 2026.11.10
    decision: "Contrôle M1 hors graphe vélo satisfait aussi si la plage est appariée à une voie du graphe vélo distincte de la route fermée (voie parallèle), comme pour les ouvrages ; appariée à la route fermée = échec"
  - id: serie_v11_e3_rapporte   # 2026-11-02, après le contrôle de couverture de V1.1
    decision: "Série tenue à l'écart V1.1 : E3 rapporté, non bloquant, seuils inchangés (échec ou minimum non atteint sans refus) ; minimum E2b sur les groupes dplus et plaine seulement, groupe ouvrage rapporté ; E3 reste calibré sur MVP + V1"
  - id: reference_r12_v12   # 2026-11-03, après le jugement V1.1 ; à partir de V1.2
    decision: "Référence R1/R2 des parcours planifiés : abscisse de l'itinéraire en haversine (R = 6 371 008,8 m, comme stadia_match) ; plage UNKNOWN là où s_origine saute (aller-retour) ; voie dont les tags diffèrent entre la date des tuiles et celle de la référence exclue de R1/R2, rapportée à part"
  - id: e5_baro_bruite   # 2026-11-03, après le jugement V1.1 ; à partir de V1.2
    decision: "E5 : référence baro corrigé local incertaine, rapportée, non comptée, si le bruit baro de la trace (qualify_baro.py, noise_m) dépasse 1,0 m, comme en E1 plaine ; tous groupes ; sans repli sur le MNT"
  - id: e1_pente_baro_sans_relief   # 2026-11-03, après le jugement V1.1 ; à partir de V1.2
    decision: "E1 : zone masquée à ± 300 m là où la pente du baro dépasse 15 % sur 50 m alors que celle du MNT reste sous 10 %"
  - id: e1_zones_avant_marche   # 2026-11-03
    decision: "E1 : zones de pente masquées avant la détection de la marche du baro ; ordre δ, zones, marche hors zones, E1"
  - id: e5_un_site_un_cas   # 2026-11-03, après le jugement V1.1 ; à partir de V1.2
    decision: "E5 : un site physique = un cas ; les croisements comptés sous plusieurs ids (tabliers voisins, même pont repassé) sont réunis ; couverture et verdict par site"
  - id: serie_v12_q1_rapporte   # 2026-11-03, composition de V1.2
    decision: "Série tenue à l'écart V1.2 : Q1 rapporté, non bloquant (aucun négatif attesté jamais utilisé) ; reste mesuré en calibration"
  - id: serie_v12_e3_rapporte   # 2026-11-03, composition de V1.2 ; remplacée par serie_v12_e3_si_couverture
    decision: "Série tenue à l'écart V1.2 : E3 rapporté, non bloquant, seuils inchangés (règle de V1.1 reconduite) ; E3 calibré sur MVP + V1 + V1.1"
  - id: serie_v12_e3_si_couverture   # 2026-11-03, après le contrôle de couverture de V1.2 ; remplace serie_v12_e3_rapporte
    decision: "Série tenue à l'écart V1.2 : E3 bloquant, seuils inchangés, si la couverture de la série comptée avant toute mesure atteint le minimum E3 ; sinon minimum non atteint rapporté sans refus ; couverture du 2026-11-03 atteinte (122 ponts, 19 à MNH ≥ 10 m, 20 > 150 m) : E3 bloquant sur V1.2"
  - id: serie_v12_tuiles   # 2026-11-03, composition de V1.2
    decision: "Série V1.2 : campagne de tuiles datée sur ses seules zones neuves, déclarée et nommée par sa section, emprise calculée après la planification définitive ; calibration sur tuiles_2026_11_02 ; build et date OSM enregistrés par campagne, instantanés de tags V1.2 à la date de ses tuiles"
  - id: serie_v11_complement_calibration   # 2026-11-03, après la correction de couverture_v1.py (6b5a1c0)
    decision: "Ouvrages V1.1 exclus à tort comme déjà vus, passés par la règle de compte de la couverture, numérotés nv-NN à la suite de V1.1 (avant V1.2) et ajoutés à la calibration V1.1 ; verdict V1.1 non revu ; ouvrage commun avec V1.2 = déjà vu en calibration, hors de V1.2"
  - id: serie_v12_s2_un_planifie   # 2026-11-03, après le contrôle de couverture de V1.2
    decision: "Série V1.2 : un seul témoin S2 planifié gardé (pl12-s2-troncais) ; pl12-s2-isere et pl12-s2-nesque retirés (nature non confirmée par OSM, 00e500f), mention retire au manifest, sans remplacement"
  # « À partir de V1.2 » (ci-dessus et plus bas) = révision bench3 : appliqué sans condition, calibration MVP, V1, V1.1
  # comprise ; verdicts rendus non revus ; seul le tirage figé de V1 et V1.1 garde son compte (README §4 quater.5).
  # Campagne tuiles_* déclarée au manifest : tout fill-cache la respecte, tuile de rues manquante = refus (§4 quater.5).

perimetre:   # README §4 bis.1
  hors_graphe_velo:
    regle: "voie OSM de l'ouvrage exclue du graphe vélo par la règle de tags du service (T03 §4.2 étape 1 : motorway, trunk en France, pedestrian, bridleway, busway ; bicycle=* prime)"
    exclus_de: [S1, E3, E4, E5]
    controle:   # passe si l'une des deux conditions est vraie
      passe_si_un_de: [{matched: false, avertissement: unmatched_range}, apparie_a_une_voie_du_graphe_velo_distincte_de_l_ouvrage]
      erreur_altitude: rapportee_si_reference_sinon_null_avec_raison
    seuils: []
    note: "Ne concerne que l'ouvrage dont la propre voie est hors graphe ; une trace hors graphe (n04, n08, n09) reste dans E5 ; à partir de V1, ses plages hors graphe sortent de S2 (README §4 ter.5)"
    source_tags: {donnees: campagne.data_versions, couche: streets, attributs: [kind, bicycle, bridge, tunnel], pas: corpus_overpass}
  absent_des_donnees:
    regle: "géométrie de l'ouvrage du corpus sans équivalent dans les tuiles de la campagne"
    rapporte_en: {tunnel: E4_non_couvert, bridge: E3_non_couvert}
    compte: false
    cas_connus: [nantes-anne-de-bretagne]
  limite_donnees:   # README §4 bis.4, 2026-11-01
    regle: "ouvrage du corpus que la source du service ne type pas comme tunnel ou pont à cause de son schéma (attribut absent de la couche lue), non un tag OSM absent ou faux"
    exclus_de: {tunnel: [E4, S1], bridge: [E3, S1]}
    compte: false
    rapporte: {erreur_altitude: mesuree_contre_sa_reference, seuils: [], note: attribut_manquant}
    cas_connus:   # appliquée par le schéma, jamais par cette liste
      - {ouvrages: [arly-galerie, nv-30, nv-37], note: "shortbread sans avalanche_protector"}

passage_pont:   # README §2.1
  horizontal: {tolerance_m: 40, points: [A, milieu, B]}
  niveau:
    applique_si: {mnh_milieu_m_min: 10.0}   # MNH = médiane MNS 25 m − MNT au milieu
    mesure: "médiane (baro corrigé − MNT) sur les stations à ± 12,5 m du milieu"
    stations_baro_min: 3
    retire_si: "mesure < 0.5 × MNH"
    sinon: {mnh_inferieur: niveau_non_discriminant, baro_insuffisant: niveau_sans_baro}
    budget_erreur_m: {bruit_baro: 1.0, decalage: 2.0, retard_baro: 4.0}   # ≈ 5 m ⇒ MNH ≥ 2 × 5 m
  porte_sur: [E3, S1, hors_graphe_velo]
  partition_series: inchangee
  attribution:   # README §4 ter.2, V1
    lit: trace_brute   # GPS d'origine, pas la trace recalée ; jamais le service
    mesure: "médiane des distances des points bruts de l'emprise à la voie de l'ouvrage (§4 bis.1)"
    concurrents: {source: campagne.data_versions, couche: streets, attributs: [bridge, tunnel]}
    attribue_si: plus_petite_mediane
    meme_ouvrage:   # README §4 ter.2, « un tablier, un ouvrage », 2026-11-01 ; ponts seulement
      types: [bridge]
      mediane_de_l_ouvrage: min_sur_ses_voies
      polygone_commun: {couche: bridges, point: plus_proche_du_milieu, morceaux_de_tuiles: reunis}   # même polygone ⇒ même pont ; polygones différents ⇒ ponts distincts
      sinon_si_une_voie_sans_polygone: {ecart_max_m: 10.0, points: 21, sur: emprise_A_B_extremites_comprises}
      verifie_sur: {meme_pont: [nantes-pirmil, nantes-audibert, mauves, nv-32, nv-45], distinct: [nv-40]}
    sinon: {marque: passage_sur_ouvrage_parallele, rapporte: true, compte: false}
    porte_sur: [E3, E4, S1, hors_graphe_velo]   # E5 (passage dessous) non concerné

serie_tenue_a_l_ecart:   # README §2 point 3 et §4 ter.4, V1
  refus_si: [bloquant_en_echec, bloquant_saute, bloquant_sous_minimum]
  couverture:   # comptée après les exclusions du banc
    compte_apres_exclusions: [hors_graphe_velo, limite_donnees, absent_des_donnees, reference_indisponible, reference_incertaine, passage_retire_niveau, passage_sur_ouvrage_parallele]
    minimums:
      E1: {traces_france_fiables: 8, km_compares: 800}
      E2b: {traces_par_groupe: 3, groupes: [dplus, plaine, ouvrage]}
      E3: {ponts: 12, ponts_mnh_10m_min: 3, ponts_plus_de_150m: 3}
      E4: {tunnels_osm: 7, tunnels_plus_de_300m: 2}
      E5: {croisements: 8}   # à partir de V1.2 : 8 sites (criteres E5.site, README §4 quater.4)
      S1: {ouvrages: 15, emprise_m: 2000}
      S2: {temoins: 4, km: 40, natures_min: 3, natures: [remblai_deblai, couvert_arbore, bati_ou_falaise, digue]}
      R1_R2: {parcours: 4, km: 400, part_non_revetu_min: 0.10, regions: hors_osm_surface}
      M1: {traces: toutes, km: 800}
      Q1: {traces_negatives: 2}
  constitution:
    groupe_e2b_trace_nouvelle:   # README §4 ter.4, décision de l'utilisateur, 2026-11-01
      dplus_si: {gain_dem_m_par_km_min: 11.0}   # qualify_baro.py gain_dem_m ÷ dist_km
      sinon_ouvrage_si: {ouvrages_comptes_min: 2}   # après exclusions
      sinon: plaine
    negatif_q1_serie_nouvelle:   # README §4 ter.4, décision de l'utilisateur, 2026-11-01
      periode: ["2015-05", "2020-09"]
      defaut_atteste_hors_qualificateur:   # l'un ou l'autre, scan ET stream complet
        baro_ko: {scan_dplus_ratio_max: 0.6, confirme_stream: {gain_rec_sur_gain_dem_max: 0.6}}
        altitude_gps_en_exces: {scan_dplus_ratio_min: 1.6, confirme_stream: {gain_rec_sur_gain_dem_min: 1.6}}   # complément, 2026-11-01
    donnees: nouvelles_seulement   # ni calibration (série MVP comprise), ni vcyclist, ni osm-surface ; ouvrages hors calibration, fenêtres ± 500 m comprises
    tirage:
      fige_avant_mesure: true
      strates: [E4, E5, S2, R1_R2, E3, Q1, reste]   # dans cet ordre ; un cas garde la première affectation
      ordre: "sha256('osm-route-details:v1:' + id)"
      tenue_a_l_ecart: {jusqu_au_minimum: true, part_min_de_la_strate: 0.333}
      nature_temoin_planifie:   # README §4 ter.4, décision de l'utilisateur, 2026-11-01
        retenue_si: {part_confirmee_osm_min: 0.5, sur: longueur_comptee}
        sinon: [nature_des_tags_confirmee_a_0.5, retire]
        confirmation_m: {couvert_arbore: {foret_ou_bord: 20}, bati_ou_falaise: {cliff: 100}, digue: {man_made_dyke: 30}, remblai_deblai: {embankment_cutting: 30}}
      marge:   # README §4 ter.4, décision de l'utilisateur, 2026-11-01
        remplissage: {minimum_majore: 0.25, arrondi: superieur, sur: chaque_composante}   # cas, km, sous-comptes, part, natures
        sinon: strate_entiere
        regle_du_tiers: si_elle_donne_plus
        seuil_de_jugement: minimum   # couverture.minimums, inchangé
    controle_couverture: {lit: [corpus, tuiles, mnt], jamais: service, ecrit_dans: manifest}
    minimum_non_atteint: collecter_d_autres_cas   # jamais changer le sel
  reference_R1_R2: {source: "Valhalla FOSSGIS trace_attributes (valhalla1.openstreetmap.de), 1 req/s", donnees_serveur: "2026-11-01T13:01Z", donnees_perso: false, meme_semaine_que: campagne.data_versions, stockage: hors_git_regenerable}   # décision de l'utilisateur, 2026-11-01 (était Stadia Maps)
  serie_v11:   # README §4 ter.10, décision de l'utilisateur, 2026-11-02 ; série V1.1 seulement
    E3: {bloquant: false, seuils: inchanges, sous_minimum: rapporte, calibration: [MVP, V1]}
    E2b: {groupes_exiges: [dplus, plaine], ouvrage: rapporte}
  serie_v12:   # README §4 quinquies, décisions de l'utilisateur, 2026-11-03 ; série V1.2 seulement
    Q1: {bloquant: false, sous_minimum: rapporte, calibration: [MVP, V1, V1.1]}
    E3: {bloquant: si_couverture_atteinte, couverture: comptee_avant_toute_mesure, seuils: inchanges, sous_minimum: rapporte, calibration: [MVP, V1, V1.1]}   # serie_v12_e3_si_couverture ; couverture 2026-11-03 atteinte : bloquant
    tuiles:
      campagne: {cle: "tuiles_<date>", emprise: zones_neuves_de_la_serie, absentes_de: tuiles_2026_11_02, nommee_par: "serie_v12.tuiles", outil: tools/tuiles_v1.py, fill_cache: false}
      emprise_calculee: apres_planification_definitive
      enregistre: [build, date_osm]   # TileJSON lu après les tuiles
      calibration: {campagne: tuiles_2026_11_02, nommee_par_ses_sections: true}
      instantanes_tags: [date_osm_de_la_campagne_v12, donnees_serveur_valhalla_des_references_v12]
  erreur_reference_R:   # README §4 bis.8, décision de l'utilisateur, 2026-11-02 ; R1, R2 (référence Valhalla) et R3
    s_applique_a: {R1_R2: parcours_planifies_reference_valhalla, R3: traces_perso, osm_surface: false}
    si: {classe_valhalla: [compacted, dirt, gravel, path, impassable], surface_osm: [asphalt, concrete, "concrete:lanes", "concrete:plates", paving_stones]}
    tags: {source: "instantané Overpass à la date des données du serveur Valhalla", fichier: "private/osm-tags/<date>.json", outil: tools/osm_tags_reference.py, empreinte: manifest, reseau_pendant_le_banc: false, voie_absente: pas_d_exclusion}
    alors: {decompte: exclue, rapportee: true}
  reference_R1_R2_v12:   # README §4 quater.1, décision de l'utilisateur, 2026-11-03 ; à partir de V1.2, toutes séries
    abscisse_itineraire: {distance: haversine, rayon_m: 6371008.8, comme: tools/stadia_match.py}
    saut_s_origine:
      points: {fichier: "<id>.baro.csv", insere: 0, tri: s_recale_m}
      si: "Δs_origine − Δs_recale > 100 m entre deux points consécutifs"   # baro_gap_max_m
      alors: {plage: "[s_origine(i), s_origine(i + 1)]", surface: UNKNOWN, comme: discontinuite_du_recalage}
    tags_differents:
      voies: {fichier: "<id>.surface.csv", colonne: way_id, classes: toutes}
      tags: [highway, surface, tracktype]
      dates: [tuiles.date_osm.planetiler_osm_osmosisreplicationtime, reference.donnees_serveur]
      si: [tag_different, voie_absente_a_une_date]
      alors: {decompte: exclue, rapporte: {cle: tags_differents, par: parcours, mesure: [longueur_m, part]}}
      source: {outil: tools/osm_tags_reference.py, instantanes: 2, hors_git: true, empreinte: manifest, reseau_pendant_le_banc: false,
               manifest: {cle: osm_tags_toutes, entree: [fichier, sha256, date], dans: [section_calibration, "serie_<clé>"], voies_retenues: toutes},
               absent: {calibration: non_appliquee_rapportee, jugement: refuse}}   # §4 quater.5
      voie_absente_aux_deux_dates: pas_differente
      voie_non_demandee_dans_un_instantane: refus   # instantané incomplet
      avant: erreur_reference_R
      s_applique_a: [R1, R2]   # pas R3

preparation:
  recalage: {outil: tools/stadia_match.py, service: "Valhalla FOSSGIS trace_attributes (valhalla1.openstreetmap.de)", debit_max: "1 req/s, en séquence", donnees_serveur: "2026-11-01T13:01Z", costing: bicycle, pas_m: 25, entree: "*.trim1km.gpx", toutes_les_traces: true}   # décision de l'utilisateur, 2026-11-01 (Stadia Maps jusqu'au MVP)
  decoupage: {max_km: 200, max_points: 16000, cas: [perso-06]}
  retard_baro:   # README §4 ter.9, décision de l'utilisateur, 2026-11-02 ; modalités rédigées par le banc
    estimation: {par: trace, partN: trace_recousue, sN: segment, grille_m: 5, residu: "baro(s + δ) − MNT(s)", mnt: "mode distance sans correction (§2.2)",
                 exclus: [points_inseres_ecartes, fenetres_masquees, stations_sans_baro], derive: {mediane_glissante_m: 5000},
                 critere: "min 1,4826 × MAD du résidu", recherche_m: [-50, 200], pas_m: 5, egalite: plus_petit_abs}
    correction: "baro corrigé(s) = baro(s + δ), avant tout décalage"
    s_applique_a: [E1, E3, E3_test_de_niveau, E5]
    sans_effet_sur: [E2, E2b, qualify_baro, tirage_v1]
    non_estimable: {si: [{stations_min: 400}, minimum_a_une_borne], alors: baro_brut, marque: retard_non_estimable, rapporte: true}
    rapporte: [retard_m, ecart_robuste_0_m, ecart_robuste_min_m, stations]
    extraits_au_jugement: {delta: trace_entiere_calibration_gelee, source: "cas.retard_baro de 2026.11.6-bench3", fichier: data/retard-baro-v1.json, absent: baro_brut, reestimation: false}   # 2026-11-02
  baro_points_inseres:   # README §2.1, étape 3
    colonne: insere   # <id>.baro.csv, 1 = point d'origine inséré par fill_jumps
    garde_si: {distance_voie_m_max: 30.0, couche: streets, tuiles: [point, 8_voisines]}
    tuiles: campagne_qui_juge_la_trace   # série tenue à l'écart : campagne de jugement
    tuile_absente_a_la_source: sans_voie
    applique_par: ord-bench   # au chargement du baro ; le recalage ne tranche pas

criteres:
  - id: E1
    metrique: "Erreur d'altitude hors ouvrage vs baro, après décalage global et retrait de tendance > 5 km"
    cas: {manifest: perso, groupes: [dplus, plaine]}
    terrain: france
    agregation: par_trace
    seuils:
      - {strate: plaine, rmse_m_max: 1.5, p95_m_max: 4.0, reference_incertaine_si: {noise_m_baro_min_exclu: 1.0, source: qualify_baro.py, rapporte: true, juge: false}}   # README §4 ter.8, 2026-11-01
      - {strate: dplus, rmse_m_max: 3.0, p95_m_max: 8.0}
    reference_incertaine_si_marche_baro:   # README §4 ter.11, décision de l'utilisateur, 2026-11-02 ; toutes strates, toutes séries
      residu: "baro(s + δ) − MNT(s), grille 5 m, MNT mode distance sans correction, δ de la trace (§4 ter.9)"
      stations_exclues: [ouvrage, fenetre_masquee, sans_baro, zone_de_pente]   # en s comme en s + δ ; zone_de_pente (§4 quater.3) à partir de V1.2
      delta_court: {fenetres_m: 200, transition_m: 200, stations_min: 20}
      delta_long: {fenetres_m: 2000, transition_m: 200, stations_min: 20, bornees_a_la_trace: true}
      seuil_m: 10.0   # |Δ court| > 10 et |Δ long| > 10, même signe
      mnt_lisse: {amplitude_m_max: 30.0, sur_m: 600}   # [s − 300, s + 300]
      ordre: [retard_baro, marche, decalage_et_tendance_E1]   # à partir de V1.2 : zones_de_pente entre retard_baro et marche (§4 quater.3)
      alors: {rapporte: [abscisse_km, delta_court_m, delta_long_m], juge: false}
      ne_touche_pas: [E2, E2b]
    zone_masquee_si_pente_baro:   # README §4 quater.3, décision de l'utilisateur, 2026-11-03 ; à partir de V1.2, toutes strates
      baro: "baro corrigé = baro(s + δ), référence E1 de la trace (§4 ter.9)"
      mnt: "mode distance sans correction (§2.2)"
      pente: {sur_m: 50, mesure: "|z(s + 50) − z(s)| / 50", grille_m: 5}
      si: {pente_baro_min_exclu: 0.15, pente_mnt_max_exclu: 0.10}
      stations_requises: [s, s_plus_50]   # avec baro et MNT, hors ouvrage et fenêtre masquée
      masque: {de: "s − 300", a: "s + 50 + 300", zones_qui_se_chevauchent: reunies}
      exclues_de: [decalage_global, retrait_de_tendance, rmse, p95, km_compares]
      ordre: [retard_baro, zones_de_pente, marche, decalage_et_tendance_E1]   # décision de l'utilisateur, 2026-11-03 : marche détectée hors des zones
      rapporte: [zones, km_masques, abscisses_km]
      ne_touche_pas: [E2, E2b, E3, E5]
      lecture:   # §4 quater.5
        km_compares: "stations comparées au baro brut, moins les zones de pente"
        hors_ouvrage: ouvrages_du_service
    passe_si: toutes_les_traces
    bloquant: true

  - id: E2
    metrique: "D+ service (preset dem) / D+ baro (preset barometric), passages mixtes masqués"
    cas: {manifest: perso, groupes: [dplus, plaine, ouvrage]}
    terrain: france
    agregation: par_trace
    seuils:
      - {ratio_min: 0.90, ratio_max: 1.20, portee: chaque_trace}
      - {ratio_median_min: 0.95, ratio_median_max: 1.12, portee: chaque_groupe}
    passe_si: tous
    bloquant: false   # indicatif : mesuré, suivi en non-régression (baseline.json)

  - id: E2b
    metrique: "Les corrections d'ouvrage ne dégradent pas le D+"
    definition: >-
      Pour chaque groupe g : médiane_g |ln(D+ service / D+ baro)| ≤ médiane_g |ln(D+ référence / D+ baro)|.
      D+ référence : le même service, appelé avec l'option publique `structure_correction: false`
      (contrat §3.2 ; le lissage est désactivé par défaut) : mêmes sources (LiDAR HD, repli
      Mapterhorn), même géométrie recalée, même preset dem, mêmes tronçons masqués. On mesure
      l'apport des corrections. Le RGE ALTI n'est pas retenu : trop peu exigeant (≈ 7 m d'erreur
      en montagne contre le LiDAR que lit le service), le critère serait presque toujours vrai.
      D+ baro : preset dem (3 m, 30 m) sur le baro transporté, le même traitement que le service
      et sa référence (décision de l'utilisateur, 2026-10-31 ; E2 indicatif reste en barometric).
    preset_baro: dem   # E2 : barometric
    cas: {manifest: perso, groupes: [dplus, plaine, ouvrage]}
    terrain: france
    agregation: mediane_par_groupe
    seuils:
      - {ecart_log_service_max: ecart_log_service_sans_correction}
    passe_si: tous_les_groupes
    bloquant: true

  - id: E3
    metrique: "Erreur d'altitude sur tablier de pont tagué (milieu et max sur l'emprise)"
    cas: {manifest: [ouvrages, ouvrages_perso, perso], types: [bridge]}
    reference: {priorite: [baro_corrige_local, mns_mediane_25m], note: "mns = cohérence seulement"}
    terrain: france
    agregation: par_pont
    agregation_passages: mediane   # écart au milieu et écart max : médianes sur les passages du pont
    decalage_local:   # README §4 bis.3
      calcul: "médiane (baro − MNT LiDAR)"
      approches_m: [50, 300]   # de chaque côté du pont
      exclut: [autres_ouvrages, fenetres_masquees]
      stations_min_par_cote: 20
      repli: {fenetre_km: [1, 3], mention: decalage_repli_1_3km}
      incertaine_si_ecart_entre_cotes_m_sup: 2.0
      incertaine: {rapporte: true, compte: false}
    perimetre: graphe_velo
    seuils:
      - {strate: pont_court, longueur_m_max: 300, milieu_abs_m_max: 2.0, max_abs_m_max: 3.0}
      - {strate: grand_pont, longueur_m_min: 300, milieu_abs_m_max: 2.0, max_abs_m_max: 5.0}
    passe_si: {part_min: 0.90}
    bloquant: true

  - id: E3_hors_france
    metrique: "Erreur d'altitude sur tablier hors LiDAR (pont interpolé)"
    cas: {manifest: [ouvrages, ouvrages_perso, perso], types: [bridge]}
    terrain: hors_france
    agregation: par_pont
    seuils: []
    passe_si: rapporte
    bloquant: false

  - id: E4
    metrique: "Erreur max vs droite entre portails ; D+ fictif dans le tunnel"
    cas: {manifest: [ouvrages, ouvrages_perso, vcyclist], types: [tunnel]}
    terrain: france
    agregation: par_tunnel_osm   # chaque way tunnel (ou suite contiguë) entre ses propres portails ; balcons non tagués → S3
    perimetre: graphe_velo
    reference: {droite_entre_portails: true, altitude_portail: "médiane du MNT des stations entre 10 et 30 m hors du portail, sur l'approche"}
    sensibilite: {portail_m: [5, 10, 20, 30], marque: reference_ambigue_si_le_verdict_bascule}
    plausibilite:   # README §4 bis.2
      pente_implicite: "|z_sortie − z_entree| / distance curviligne entre portails retenus"
      pente_max: 0.25
      sinon: {marque: reference_indisponible, rapporte: true, compte: false}
    bande_invalide:   # README §4 bis.2
      si: [chevauche_autre_ouvrage, stations_hors_ouvrage_moins_de_3, balcon_entre_tunnels_osm]   # autre ouvrage : tunnel, galerie, balcon S3, pont ou tunnel des tuiles
      ouvrage_des_tuiles: {source: campagne.data_versions, attributs: [bridge, tunnel], corpus_ou_non: true}
      balcon_entre_tunnels_osm: {troncon_air_libre_m_max: 120}   # bande sur un tronçon à l'air libre < 120 m entre deux tunnels OSM
      remplacement: premiere_bande_valide_plus_loin_dans_la_serie_meme_cote
      distance_max_m: 1000
      sinon: {marque: reference_indisponible, rapporte: true, compte: false}
    seuils:
      - {max_abs_m_max: 5.0, dplus_fictif_m_max: 5.0}
    passe_si: {part_min: 0.857}   # 6/7
    bloquant: true

  - id: E5
    metrique: "|service − référence| au croisement d'un passage sous un pont (README §4 ter.7)"
    cas: {manifest: [ouvrages, perso], types: [passage_sous_pont]}
    agregation: par_croisement
    perimetre: graphe_velo   # l'ouvrage du dessus peut être hors graphe ; c'est le passage dessous qui doit l'être
    reference:   # README §4 ter.7, décision de l'utilisateur, 2026-11-01 ; jamais le service
      retire_si: {trace_sur_ouvrage: {couche: streets, attributs: [bridge, tunnel], distance_m_max: 10, angle_deg_max: 20}, marque: e5_trace_sur_ouvrage}
      baro_corrige_local: {si: trace_perso_fiable, decalage: "médiane baro − MNT, 200 à 1 500 m de part et d'autre", grille_m: 5, pas_brut_max_m: 100,
                           incertaine_si: {ecart_decalages_cotes_m_min: 2.0, cotes_m: [200, 1500], points_baro_par_cote_min: 3, points_baro: bruts_hors_inseres_ecartes_et_fenetres_masquees, abscisse_points: corrigee_du_retard, fenetres_masquees_lues_a: abscisse_corrigee, repli_mnt: false}, marque: e5_reference_incertaine,
                           traces_en_parties: {partN: recousues_par_abscisse, sN: segment_par_segment}}   # 2026-11-01, après 2026.11.6
      baro_incertaine_si_bruit:   # README §4 quater.2, décision de l'utilisateur, 2026-11-03 ; à partir de V1.2
        noise_m_baro_min_exclu: 1.0   # comme E1 plaine (§4 ter.8)
        source: qualify_baro.py   # noise_m de la trace entière ; segments .sN : celui de la trace
        groupes: tous
        repli_mnt: false
        marque: e5_reference_incertaine
        raison: baro_bruite
      sinon_mnt:
        indisponible_si: [{mnt_sans_donnee_a_m: 10}, {mnt_lit_le_tablier: {bosse_m_min: 2.0, approches_m: [20, 50], mesure: "MNT(croisement) − moyenne des médianes MNT des approches"}}]
        marque: e5_reference_indisponible
        incertaine_si: {mnt_bosse_m: [1.0, 2.0], bornes: incluses, marque: e5_reference_incertaine}   # 2026-11-01, après 2026.11.6
        incertaine_si_approche_sur_ouvrage: {approches_m: [20, 50], couche: streets, attributs: [bridge, tunnel], tuiles: [station, 8_voisines], distance_m_max: 10, angle_deg_max: 20, hors: voies_de_l_ouvrage_du_dessus, avant: bosse, raison: approche_sur_ouvrage, marque: e5_reference_incertaine}   # 2026-11-02, après le jugement V1
        plages_o_vcyclist: {croisement: milieu_de_la_plage, ecart: max_sur_la_plage, approches_depuis: bouts_de_la_plage}   # 2026-11-01
    site:   # README §4 quater.4, décision de l'utilisateur, 2026-11-03 ; à partir de V1.2, toutes séries
      relie: [meme_ouvrage, {meme_passage: true, ecart_d_milieu_m_max: 40.0}]   # composantes connexes, toutes traces
      passage_compte: "référence baro ou MNT, ni retiré, ni incertain, ni indisponible"
      verdict: {echec_si: un_passage_compte_en_echec, sinon_si_un_passage_compte: reussi, sinon: marque_du_site_non_compte}
      ecart_rapporte: max_des_passages_comptes
      rapporte: [ouvrages, passages, cas]
      couverture: {compte: sites_avec_un_passage_compte, minimum: 8}
      lecture:   # §4 quater.5
        relient: passages_comptes_et_non_comptes   # E5_passage_dessus exclu
        ecart: d_milieu_m
        sans_abscisse: par_id_seulement   # extraits et témoins vcyclist
        tirage: distance_entre_points_de_croisement   # couverture_v1.py, approche d_milieu_m par excès
    seuils:
      - {abs_m_max: 1.0, reference: mnt}
      - {abs_m_max: 2.0, reference: baro_corrige_local}   # comme E3 ; 2026-11-01, après 2026.11.6
    passe_si: tous
    bloquant: true

  - id: S1
    metrique: "Rappel en longueur des ponts/tunnels tagués OSM"
    cas: {manifest: [ouvrages, ouvrages_perso, vcyclist]}
    agregation: longueur_totale
    perimetre: graphe_velo   # balcons non tagués entre tunnels exclus
    longueur_typee:   # README §4 ter.1, V1
      mesure: recouvrement_continu   # [s_A, s_B] ∩ segments structure (bridge/tunnel) du service
      tolerance_borne_m: 2.5   # demi-pas : segment arrêté à ≤ 2,5 m d'une borne prolongé jusqu'à elle
      rappel: "longueur typée / (s_B − s_A)"
      ne_touche_pas: [E3, E4]
    seuils:
      - {rappel_min: 0.95}
    passe_si: tous
    bloquant: true

  - id: S2
    metrique: "Faux positifs d'ouvrage"
    cas: {manifest: [vcyclist_temoins_negatifs, perso]}
    agregation: longueur_totale
    hors_graphe_velo:   # README §4 ter.5, V1, 2026-11-01
      plages: M1.hors_graphe_velo   # même règle : route motorisée fermée au vélo, plage continue ≥ 50 m, tuiles seulement
      exclues_de: [ouvrages_fictifs, longueur_typee, longueur_totale]
      rapporte: {cle: hors_graphe_velo_m, par: temoin, mesure: longueur_m}
      ne_touche_pas: [E5]
    ouvrage_reel_sur_temoin:   # README §4 ter.6, décision de l'utilisateur, 2026-11-01
      tags: [bridge, tunnel, "tunnel=avalanche_protector", "covered=yes"]   # sur la voie même du témoin
      jamais_fictif: true
      plage_retiree: {de: A, a: B, marge_m: 35}   # comme la marge x de vcyclist
      exclue_de: [ouvrages_fictifs, longueur_typee, longueur_totale]
      rapporte_en: {absent_du_schema_de_la_source: limite_donnees, sinon: ouvrage}
      erreur_altitude: {covered: contre_mnt_aux_stations, avalanche_protector: comme_tunnel, seuils: []}
      voie_du_temoin: {fichiers: stations, colonne: way, plages: [X, O]}   # pas spans.csv
      temoin_sort_si: [ouvrage_objet_du_temoin, {part_longueur_min: 0.5, compte: par_ouvrage}]
      objet_du_temoin: "catégorie vcyclist nommant la nature d'un ouvrage emprunté (galerie, tunnel, pont, viaduc)"
      cas: {sort: [tn12-arly-galleries], reste_masque: [tn10-roselend]}
      source_tags: base_osm_du_temoin   # réserve : vérifié le 2026-11-01 sur les tags actuels
    seuils:
      - {ouvrages_fictifs_max: 0, part_longueur_max: 0.005}
    passe_si: tous
    bloquant: true

  - id: S3
    metrique: "Ouvrage non tagué (stn-acces-nord ; balcons non tagués entre tunnels, réf. vcyclist S) : altitude, rapportée"
    cas: {manifest: [ouvrages, perso, vcyclist], ids: [stn-acces-nord], balcons_entre_tunnels: true}
    seuils: []
    passe_si: rapporte
    bloquant: false

  - id: R1
    metrique: "Accord de classe de revêtement vs Stadia (total et hors inconnu Stadia)"
    cas: {manifest: osm_surface}
    agregation: par_parcours
    seuils:
      - {accord_min: 0.85, accord_hors_inconnu_min: 0.85}
    passe_si: tous
    bloquant: true

  - id: R2
    metrique: "Accord revêtu / non revêtu vs Stadia"
    cas: {manifest: osm_surface}
    agregation: par_parcours
    seuils:
      - {accord_min: 0.97}
    passe_si: tous
    bloquant: true

  - id: R3
    metrique: "Accord du revêtement vs Stadia Maps trace_attributes (edge.surface), en longueur, même table de classes que R1"
    cas: {manifest: perso, groupes: [dplus, plaine, ouvrage, hors_france]}
    reference: {source: "Valhalla FOSSGIS trace_attributes (Stadia Maps jusqu'au MVP)", fichiers: "private/recales/<id>.surface.csv (hors git)"}
    agregation: par_trace
    seuils:
      - {accord_classe_min: 0.85, accord_revetu_non_revetu_min: 0.97}
    passe_si: tous
    bloquant: false   # README §4 bis.7, 2026-11-01 : rapporté, seuils inchangés

  - id: M1
    metrique: "Appariement : part non appariée et part unknown, en longueur"
    cas: {manifest: [osm_surface, perso, vcyclist]}
    agregation: par_parcours
    hors_reseau:   # README §4 bis.6, 2026-11-01 ; traces recalées
      regle: "plage de la trace recalée dont aucun point n'a de voie de la couche streets à moins de 30 m"
      distance_voie_m_max: 30.0
      tuiles: {source: campagne_qui_juge_la_trace, couche: streets, voisinage: [point, 8_voisines], tuile_absente_a_la_source: sans_voie}
      exclue_de: [non_apparie, longueur_totale, unknown]
      rapporte: {cle: hors_reseau, par: trace, mesure: longueur_m}
      lit: [tuiles, trace_recalee]   # jamais la réponse du service
    hors_graphe_velo:   # README §4 ter.3, V1 ; traces recalées ; resserrée le 2026-11-01 (règles 2026.11.2)
      regle: "plage continue (≥ 50 m) de stations recalées dont la voie la plus proche de la couche streets (≤ 30 m, rails exclus) est une route motorisée fermée au vélo : motorway, trunk, ou route bicycle=no"
      distance_voie_m_max: 30.0
      voies_visees: {kinds: [motorway, trunk], routes_motorisees_bicycle_no: true, bicycle_prime: true}   # T03 §5.3 étape 6
      plage_min_m: 50.0   # plage plus courte (simple traversée) : jugée par M1
      restent_dans_M1: [pedestrian, footway_ou_path_bicycle_no, busway, steps, traversee_moins_de_50m]
      voie_la_plus_proche_exclut: [rail]
      tuiles: {source: campagne_qui_juge_la_trace, couche: streets, voisinage: [point, 8_voisines], attributs: [kind, bicycle]}
      exclue_de: [non_apparie, longueur_totale, unknown]
      rapporte: {cle: hors_graphe_velo_m, par: trace, mesure: longueur_m}
      controle: {passe_si_un_de: [{matched: false, avertissement: unmatched_range}, apparie_a_une_voie_du_graphe_velo_distincte_de_la_route_fermee], sinon: echec_M1}   # voie parallèle : 2026-11-02
      priorite: hors_reseau_d_abord
      risque_circularite: accepte   # décision de l'utilisateur, 2026-11-01
    seuils:
      - {non_apparie_max: 0.01, unknown_max: 0.02}
    passe_si: tous
    bloquant: true

  - id: L1
    metrique: "Latence à froid, requête de 100 km, caches vidés (live)"
    cas: {manifest: perso, dist_km: [90, 130]}
    agregation: p95_sur_5_essais
    seuils:
      - {terrain: france, p95_s_max: 20}
      - {terrain: hors_france, p95_s_max: 5}
    passe_si: tous
    bloquant: false   # dépend du réseau et des API publiques

  - id: L2
    metrique: "Latence à chaud, même requête rejouée"
    cas: {manifest: perso, dist_km: [90, 130]}
    agregation: p95_sur_20_essais
    seuils:
      - {p95_ms_max: 500}
    passe_si: tous
    bloquant: true

  - id: Q1
    metrique: "Rejet des négatifs par qualify_baro.py"
    cas: {manifest: perso, groupes: [negatif]}
    seuils:
      - {fiables_max: 0}
    passe_si: tous
    bloquant: true
