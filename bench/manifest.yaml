# Manifest du banc qualité d'osm-route-details.
# Une entrée par cas. Les chemins relatifs partent de bench/. Les fichiers marqués `hors_git`
# ne sont pas versionnés : leur empreinte sha256 permet de vérifier qu'on mesure bien la même chose.
# Les séries `tenue_a_l_ecart` ne servent qu'au jugement final d'un incrément (README §2) ;
# elles sont tirées par tools/series_groups.py (groupes d'ouvrages, héritage, masquage).
version: 1
date: "2026-10-30"

depots_externes:
  vcyclist: {depot: "git@github.com:glandais/vcyclist.git", commit: 4dfd6c5, version: "6.11.0-1", licence_code: "Apache-2.0",
             copie: data/vcyclist/, sommes: data/vcyclist/SHA256SUMS, sha256_sommes: b572a94f489c083d89be36e627e43cfb54eca0cc64fee20401d50b63c40f91ac}
  osm-surface: {depot: "osm-surface (dépôt local de l'utilisateur, sans remote)", commit: 44e5da6, licence_code: "Apache-2.0",
                licence_sha256: e27423bbbba12e73fc6ef134fec4596d321a000d414db097c960c5c5f23c79bb, licence_note: "LICENSE ajouté le 2026-10-30, pas encore commité dans osm-surface",
                copie: data/osm-surface/, sommes: data/osm-surface/SHA256SUMS, sha256_sommes: 8042a50b526f89084d5b84ee0523bc1bfcdf78b63f7d06db604c3ecf5535789a}

