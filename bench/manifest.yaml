# ---------------------------------------------------------------------------------------------
# 3. Corpus d'ouvrages (versionné : data/ouvrages.yaml, 36 entrées)
# ---------------------------------------------------------------------------------------------
ouvrages:
  fichier: data/ouvrages.yaml
  geometrie: data/ouvrages-geom.json
  reponses_brutes: data/ouvrages-osm/   # Overpass (ODbL) et API alti IGN (Etalab 2.0), 2026-10-30
  scripts: tools/ouvrages/              # à lancer depuis un dossier contenant raw/ (copie de data/ouvrages-osm)
  licence: "ODbL (OSM) / Etalab 2.0 (IGN)"
  reference: "Médiane MNS 25 m au milieu des ponts français (cohérence seulement) + MNT RGE ALTI + MNT/MNS/MNH LiDAR HD (ressource ign_lidar_hd_mnx_multi_wld) aux extrémités et au milieu ; baromètre corrigé quand une trace perso le traverse (data/deck_baro_vs_lidar.csv)"
  serie_tenue_a_l_ecart: [donostia-zurriola, normandie, recoumene]
  groupes: "private/series.csv n'est pas requis : tools/series_groups.py recalcule groupes et séries"
  regle_serie: "par groupe d'ouvrages, voir README §2 et tools/series_groups.py"

mesures_derivees:
  - id: deck-baro-vs-lidar
    fichier: data/deck_baro_vs_lidar.csv
    teste: "Baromètre corrigé du décalage local vs MNS LiDAR au milieu des ouvrages traversés"
    script: tools/deck_baro_vs_lidar.py
    provenance: "Traces perso (pseudonymes) × data/ouvrages.yaml, 2026-10-30"

